name: Release to TestFlight

# Archives, signs and ships a build to TestFlight.
#
# Signing deliberately avoids fastlane match and a certificates repo. Instead
# `xcodebuild -allowProvisioningUpdates` is handed an App Store Connect API key and
# provisions the certificate and profile itself on the ephemeral runner.
#
# Required repository secrets:
#   ASC_KEY_ID     — the App Store Connect API key ID
#   ASC_ISSUER_ID  — the issuer ID from the same page
#   ASC_KEY_P8     — the RAW contents of the downloaded AuthKey_XXXX.p8, pasted whole,
#                    including the BEGIN/END lines. Not base64. GitHub secrets accept
#                    multi-line values, and the upload action expects PEM text.
#   TEAM_ID        — the 10-character Apple Developer team ID
#
# NOTE: the API key must have the App Manager role. A Developer-role key
# authenticates fine and then fails the upload with an opaque "unauthorized".

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new in this build (shown to testers)"
        required: false
        default: "Automated build"
  # `workflow_dispatch` is a button a human presses. This development environment can
  # neither press it (the app token has no `actions: write`) nor push a tag (the git proxy
  # allows only the working branch), so the trigger has to be an ordinary commit: changing
  # the `.release` marker file ships whatever that commit contains. Scoped to a path so
  # normal commits don't burn a signing run.
  push:
    branches:
      - "claude/**"
    paths:
      - ".release"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  testflight:
    name: Archive, sign, upload
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret $v"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All four secrets present."

      - name: Select newest available Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # xcodebuild looks for keys in this well-known location.
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # Sanity check without ever printing the key itself.
          grep -q "BEGIN PRIVATE KEY" ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            || { echo "::error::ASC_KEY_P8 is not a PEM private key. Paste the whole AuthKey_XXXX.p8 file contents, including the BEGIN/END lines."; exit 1; }

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # Ad-hoc signed on purpose (CODE_SIGN_IDENTITY=-), NOT signed for distribution.
      #
      # Xcode's automatic signing always provisions an *iOS App Development* profile for
      # the archive action and re-signs for distribution at export. A development profile
      # must enumerate devices, and a team that has never had a Mac plugged into it has
      # none, so the archive dies with "your team has no devices from which to generate a
      # provisioning profile". Overriding CODE_SIGN_IDENTITY to "Apple Distribution" is
      # not an escape — automatic signing rejects it as a conflicting identity.
      #
      # Ad-hoc signing sidesteps provisioning entirely: it is local, needs no profile and
      # no device, and still applies CODE_SIGN_ENTITLEMENTS, so the iCloud container
      # survives into the archive. The export step below then creates the distribution
      # certificate and App Store profile (neither of which involves devices) and
      # re-signs. See https://developer.apple.com/forums/thread/756119
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Remli.xcodeproj \
            -scheme Remli \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Remli.xcarchive" \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee "$RUNNER_TEMP/release.log"

      - name: Write export options
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Remli.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee -a "$RUNNER_TEMP/release.log"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ runner.temp }}/export/Remli.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_KEY_P8 }}
          # `inputs` is empty on a tag push, so fall back to the tag name.
          release-notes: ${{ inputs.notes || format('Build from {0}', github.ref_name) }}
          uses-non-exempt-encryption: false

      - name: Keep the IPA for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Remli-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/
          if-no-files-found: warn
          retention-days: 14

      # Same reasoning as ci.yml: development happens on a machine that cannot compile or
      # sign this project, so signing and upload failures have to be read back over plain
      # git rather than an authenticated API call. Release runs are the ones where that
      # matters most — they exercise entitlements, provisioning and upload, none of which
      # the simulator builds touch.
      - name: Publish signing diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/rel-log"
          grep -aE "error:|Provisioning|provisioning profile|entitlement|Code Sign|certificate|unauthorized|No profiles|exportArchive|\*\* (ARCHIVE|EXPORT)" \
            "$RUNNER_TEMP/release.log" 2>/dev/null | head -200 > "$RUNNER_TEMP/rel-log/errors.txt" || true
          tail -200 "$RUNNER_TEMP/release.log" 2>/dev/null > "$RUNNER_TEMP/rel-log/tail.txt" || true
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/rel-log/sha.txt"

          cd "$RUNNER_TEMP/rel-log"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Release diagnostics for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/release-log

      - name: Publish result as a git tag
        if: always()
        run: |
          outcome=$([ "${{ job.status }}" = "success" ] && echo pass || echo fail)
          tag="rel-${outcome}-${GITHUB_SHA}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git ls-remote --tags origin 'refs/tags/rel-*' \
            | awk '{print $2}' \
            | sed 's#refs/tags/##' \
            | while read -r old; do
                [ "$old" = "$tag" ] || git push --delete origin "$old" || true
              done

          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"
