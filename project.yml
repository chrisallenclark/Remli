# XcodeGen project definition.
#
# The .xcodeproj is NOT committed — CI runs `xcodegen generate` on every build.
# This file is the source of truth for targets, settings and capabilities.
# Docs: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: Remli

options:
  bundleIdPrefix: com.chrisallenclark
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    # Swift 5 language mode for now. Swift 6 strict concurrency plus SwiftData actor
    # isolation produces hundreds of errors that are painful to resolve without a local
    # compiler; we tighten this once the app exists and builds green.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is deliberately NOT set here. It is passed on the xcodebuild
    # command line during release so that ordinary CI builds need no Apple account
    # and no secrets, and so XcodeGen never depends on an env var being present.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Remli:
    type: application
    platform: iOS
    sources:
      # Sources/Shared holds models and the design system. It is a plain source
      # folder rather than a Swift package because XcodeGen can compile the same
      # folder into several targets, which is all the widget extension will need
      # later — without the overhead of an SPM package.
      - path: Sources/Shared
      - path: Sources/Remli
      - path: Resources
        excludes:
          - "Info.plist"
          - "Widgets-Info.plist"
          - "Remli.entitlements"
    dependencies:
      - target: RemliWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisallenclark.remli
        PRODUCT_NAME: Remli
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Remli.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SUPPORTS_MACCATALYST: NO
        # Dark, not system-adaptive.
        #
        # Remli is a place you go to think, and the two screens that carry the product —
        # the Map and a Space — are built on light emitted against darkness: glowing nodes,
        # a Space's colour washing a near-black ground. Those effects have no light-mode
        # equivalent; on white they read as smudges. Committing to one world means both
        # screens can be designed properly instead of compromised twice.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        SWIFT_EMIT_LOC_STRINGS: YES
        # Capabilities arrive in later phases (CloudKit, App Groups, background modes).
        # P0 deliberately ships with the minimum entitlement surface so that the very
        # first signed build cannot fail on a provisioning profile mismatch.

  # The widget extension compiles exactly one shared file — CaptureRoute.swift — which
  # imports nothing beyond Foundation and AppIntents. Pulling in all of Sources/Shared
  # would link SwiftData, Speech, EventKit and the services layer into an extension that
  # holds no data and only needs to open a URL.
  RemliWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widgets
      - path: Sources/Shared/Intents/CaptureRoute.swift
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisallenclark.remli.widgets
        PRODUCT_NAME: RemliWidgets
        INFOPLIST_FILE: Resources/Widgets-Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # Unit tests for the pure logic — hierarchy, chip ordering, scoring. Anything needing a
  # live view or a real device is verified on the phone instead; there is no simulator in
  # the development environment, only in CI, and a UI test suite nobody can run locally
  # would rot faster than it caught anything.
  RemliTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Remli
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrisallenclark.remli.tests
        GENERATE_INFOPLIST_FILE: YES
        # @testable requires the app to be built without optimisation, which Debug already
        # does. Tests never run against a Release build.
        SWIFT_VERSION: "5.0"

schemes:
  Remli:
    build:
      targets:
        Remli: all
        RemliWidgets: all
        RemliTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RemliTests
    archive:
      config: Release
